<!doctype html>
<html lang="en" dir="ltr" class="dark" data-accent="crimson" data-motion-pref="full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Convert mouse sensitivity between FPS games. cm/360, eDPI, profiles and comparison — all calculated locally." />
    <meta name="theme-color" content="#09090b" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Aimless · FPS sensitivity converter</title>
    <script>
      // Apply the saved theme/language before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('sc.settings') || '{}').state || {};
        var t = s.theme || 'dark';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        var r = document.documentElement;
        if (s.language) r.lang = s.language;
        if (s.language === 'ar') r.dir = 'rtl';
        r.dataset.accent = s.accent || 'crimson';
        r.dataset.density = s.density || 'comfortable';
        r.dataset.motionPref = s.motion || 'full';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
