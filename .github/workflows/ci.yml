name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
